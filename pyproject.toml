[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horse-racing-collector"
version = "0.1.0"
description = "Professional horse racing data collector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.49.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9.10",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "loguru>=0.7.3",
  "typer>=0.15.0",
  "tenacity>=9.0.0",
  "httpx>=0.28.0",
  "jdatetime>=5.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
horse-collector = "main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
